# Complete example for testing AwsDocumentDBCluster with Floci local cloud emulator.
# It creates:
# 1. A Schedule defining recurring cron times for 'scale-up' and 'scale-down'
# 2. An AwsDocumentDBCluster CR pointing to Floci (http://localhost:4566)
#
# Note: The cluster identifier 'timeterra-demo-docdb' matches the one created by 'task floci:seed'

apiVersion: timeterra.d3vlo0p.dev/v1alpha1
kind: Schedule
metadata:
  name: docdb-schedule
  namespace: timeterra
spec:
  enabled: true
  actions:
    scale-up:
      cron: "0/4 * * * *"
    scale-down:
      cron: "2/4 * * * *"
---
apiVersion: timeterra.d3vlo0p.dev/v1alpha1
kind: AwsDocumentDBCluster
metadata:
  name: demo-docdb-cluster
  namespace: timeterra
spec:
  enabled: true
  schedule: docdb-schedule
  serviceEndpoint: "http://localhost:4566"
  credentials:
    secretName: aws-credentials
    namespace: timeterra
  dbClusterIdentifiers:
    - identifier: timeterra-demo-docdb
      region: us-east-1
  actions:
    scale-up:
      command: scale
      instanceClass: "db.r5.xlarge"
    scale-down:
      command: scale
      instanceClass: "db.r5.large"
