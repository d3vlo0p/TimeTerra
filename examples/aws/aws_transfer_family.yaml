# Complete example for testing AwsTransferFamily with Floci local cloud emulator.
# It creates:
# 1. A Schedule defining recurring cron times for 'stop' and 'start'
# 2. An AwsTransferFamily CR pointing to Floci (http://localhost:4566)
#
# Note: The serverId below can be updated to match the one generated by 'task floci:seed'
# or retrieved via: aws --endpoint-url http://localhost:4566 transfer list-servers

apiVersion: timeterra.d3vlo0p.dev/v1alpha1
kind: Schedule
metadata:
  name: transfer-schedule
  namespace: timeterra
spec:
  enabled: true
  actions:
    stop:
      cron: "0/4 * * * *"
    start:
      cron: "2/4 * * * *"
---
apiVersion: timeterra.d3vlo0p.dev/v1alpha1
kind: AwsTransferFamily
metadata:
  name: demo-transfer-family
  namespace: timeterra
spec:
  enabled: true
  schedule: transfer-schedule
  serviceEndpoint: "http://localhost:4566"
  credentials:
    secretName: aws-credentials
    namespace: timeterra
  serverIds:
    - id: s-8856ffa07811418da
      region: us-east-1
  actions:
    stop:
      command: stop
    start:
      command: start
