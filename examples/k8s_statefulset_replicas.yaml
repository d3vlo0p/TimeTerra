# Complete end-to-end example for testing K8sPodReplicas with a Kubernetes StatefulSet.
# It creates:
# 1. A headless Service required by the StatefulSet
# 2. A test StatefulSet (demo-statefulset)
# 3. A Schedule defining cron triggers for 'scaleup' and 'scalein'
# 4. A K8sPodReplicas CR that targets resourceType: StatefulSet

apiVersion: v1
kind: Service
metadata:
  name: demo-statefulset-svc
  namespace: default
  labels:
    app.kubernetes.io/name: demo-statefulset
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: demo-statefulset
  ports:
    - name: web
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-statefulset
  namespace: default
  labels:
    app.kubernetes.io/name: demo-statefulset
spec:
  serviceName: demo-statefulset-svc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-statefulset
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-statefulset
    spec:
      containers:
        - name: app
          image: nginx:alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: timeterra.d3vlo0p.dev/v1alpha1
kind: Schedule
metadata:
  name: demo-statefulset-schedule
spec:
  enabled: true
  actions:
    # Scale up at every 4th minute (e.g., :00, :04, :08, etc.)
    scaleup:
      cron: "0/4 * * * *"
    # Scale down at every 4th minute offset by 2 (e.g., :02, :06, :10, etc.)
    scalein:
      cron: "2/4 * * * *"
---
apiVersion: timeterra.d3vlo0p.dev/v1alpha1
kind: K8sPodReplicas
metadata:
  name: demo-statefulset-replicas
spec:
  enabled: true
  resourceType: StatefulSet
  namespaces:
    - default
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: demo-statefulset
  schedule: demo-statefulset-schedule
  actions:
    scaleup:
      replicas: 2
    scalein:
      replicas: 1
